        scene.add(particles);

        function resize() {
          const width = window.innerWidth;
          const height = window.innerHeight;
          renderer.setSize(width, height, false);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          const desktop = width >= 900;

          group.position.x = desktop ? 2.05 : 0.32;
          group.position.y = desktop ? -0.1 : -1.45;
          group.scale.setScalar(desktop ? 1.12 : 0.62);

        let raf = 0;
        function animate(time) {
          const t = time * 0.001;
          group.rotation.y = Math.sin(t * 0.55) * 0.16;
          group.rotation.x = Math.sin(t * 0.38) * 0.05;
          ring.rotation.z = t * 0.18;
          ring.rotation.y = 0.32 + Math.sin(t * 0.35) * 0.12;
          particles.children.forEach((particle) => {
            particle.userData.angle += particle.userData.speed;
            particle.position.x = Math.cos(particle.userData.angle) * particle.userData.radius;
            particle.position.z = Math.sin(particle.userData.angle) * particle.userData.radius;
            particle.rotation.x += 0.006;
            particle.rotation.y += 0.004;
          });
          renderer.render(scene, camera);
          raf = requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize, { passive: true });
        resize();
        raf = requestAnimationFrame(animate);

        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            cancelAnimationFrame(raf);
          } else {
            raf = requestAnimationFrame(animate);
          }
        });
      } catch (error) {
        sceneEl.classList.add('no-webgl');
      }
    }
